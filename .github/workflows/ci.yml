name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Install frozen project and development dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Check tracked files for credential material
        run: uv run python scripts/check_secret_hygiene.py
      - name: Audit installed dependencies for known vulnerabilities
        run: uvx --from pip-audit==2.10.1 pip-audit --path .venv/lib/python3.12/site-packages --progress-spinner off
      - name: Test
        run: uv run pytest -q
      - name: Verify release contracts
        run: uv run python scripts/check_release_contracts.py --expected-version 0.6.10 --require-clean
      - name: Build release wheel
        run: uv run python -m build --wheel
      - name: Rebuild release wheel deterministically
        run: uv run python -m build --wheel --outdir dist-repro
      - name: Verify release artifact
        run: uv run python scripts/verify_release_artifact.py dist/*.whl --reproducible-with dist-repro/*.whl
      - name: Smoke installed release artifact
        run: uv run python scripts/verify_installed_release.py dist/*.whl --requirements requirements.txt
