name: Coinbase x402 hotfix

on:
  pull_request:
    paths:
      - ".github/workflows/coinbase-x402-hotfix.yml"
      - ".env.example"
      - ".gitignore"
      - ".railwayignore"
      - "pyproject.toml"
      - "requirements.txt"
      - "server.json"
      - "uv.lock"
      - "src/coinbase_x402.py"
      - "src/config.py"
      - "src/public_metadata.py"
      - "src/resource_server.py"
      - "tests/test_coinbase_x402.py"
      - "tests/test_resource_server.py"
      - "scripts/audit_coinbase_hotfix.mjs"
      - "scripts/direct_prod_coinbase_release.mjs"
      - "scripts/test_direct_prod_coinbase_release.mjs"
      - "railway.toml"
  push:
    branches:
      - "codex/production-x402"

permissions:
  contents: read

concurrency:
  group: coinbase-x402-hotfix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLOCKSIZE_API_KEY: test
      X402_SOLANA_WALLET_ADDRESS: "11111111111111111111111111111111"
      X402_EVM_WALLET_ADDRESS: "0x1111111111111111111111111111111111111111"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Install the exact locked environment
        run: uv sync --locked --all-extras
      - name: Lint the hotfix surface
        run: >-
          uv run ruff check
          src/config.py
          src/coinbase_x402.py
          src/resource_server.py
          tests/test_coinbase_x402.py
          tests/test_resource_server.py
      - name: Compile application modules
        run: uv run python -m compileall -q src
      - name: Validate Railway deployment health gate
        run: >-
          uv run python -c
          'import tomllib; config = tomllib.load(open("railway.toml", "rb"));
          assert config["deploy"]["healthcheckPath"] == "/deployz"'
      - name: Test gateway and resource integration
        run: uv run pytest tests/test_coinbase_x402.py tests/test_resource_server.py -q
      - name: Test direct-production safety controller
        run: node --test scripts/test_direct_prod_coinbase_release.mjs
      - name: Audit installed Python dependencies
        run: >-
          uvx --from pip-audit==2.10.0 pip-audit
          --path .venv/lib/python3.12/site-packages
          --progress-spinner off
      - name: Reject whitespace errors
        run: git diff --check
