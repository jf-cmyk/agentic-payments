# Production deployment authority is intentionally disabled in GitLab.
# Railway deployments are owned by the repository's GitHub source integration.
workflow:
  rules:
    - when: always

stages:
  - validate

validate_gitlab_deploy_authority_disabled:
  stage: validate
  image: alpine:3.20
  variables:
    GIT_STRATEGY: none
  script:
    - 'printf "%s\n" "GitLab CI is intentionally deployment-inert; no production action was taken."'
