[project]
name = "blocksize-mcp-x402"
version = "0.6.3"
description = "Blocksize Capital MCP Server with x402 Micropayment Integration — Institutional-grade crypto market data for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Blocksize Capital" }
]

dependencies = [
    # MCP Server
    "fastmcp>=2.3.0",
    # HTTP framework for resource server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # HTTP client
    "httpx>=0.27.0",
    # Websocket client for upstream subscription-backed cache feeds
    "websockets>=12.0",
    # Data validation
    "pydantic>=2.10.0",
    "pydantic-settings==2.14.2",
    # FastMCP's in-memory store expects TLRUCache, absent from cachetools 4.x.
    "cachetools>=5.3.0",
    # Environment management
    "python-dotenv>=1.0.0",
    # Coinbase CDP authenticated x402 facilitator integration. Exact pins keep
    # the signed-payload schema and auth implementation reproducible.
    "x402[fastapi]==2.8.0",
    "cdp-sdk==1.47.1",
    # Exact advisory-fixed versions for transitive packages in the production
    # payment/runtime graph (audited 2026-08-21).
    "cryptography==50.0.0",
    "joserfc==1.6.8",
    "mcp==1.28.1",
    "pyjwt==2.13.0",
    "python-multipart==0.0.31",
    "starlette==1.3.1",
    "urllib3==2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
