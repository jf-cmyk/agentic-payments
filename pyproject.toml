[project]
name = "blocksize-mcp-x402"
version = "0.6.13"
description = "Blocksize live multi-asset market data for AI agents: signed x402 for direct public HTTP, authenticated-connector-only starter credits, and a contact-sales authenticated account plan"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Blocksize Capital" }
]

dependencies = [
    # MCP Server
    "fastmcp>=2.3.0",
    # HTTP framework for resource server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # HTTP client
    "httpx>=0.27.0",
    # Websocket client for upstream subscription-backed cache feeds
    "websockets>=12.0",
    # Data validation
    "pydantic>=2.10.0",
    "pydantic-settings==2.14.2",
    # FastMCP's in-memory store expects TLRUCache, absent from cachetools 4.x.
    "cachetools>=5.3.0",
    # Environment management
    "python-dotenv>=1.0.0",
    # Coinbase CDP authenticated x402 facilitator integration. Exact pins keep
    # the signed-payload schema and auth implementation reproducible.
    "x402[fastapi]==2.8.0",
    "cdp-sdk==1.47.1",
    # Exact advisory-fixed versions for transitive packages in the production
    # payment/runtime graph (audited 2026-08-21).
    "cryptography==50.0.0",
    "joserfc==1.6.8",
    "mcp==1.28.1",
    "pyjwt==2.13.0",
    "python-multipart==0.0.31",
    "starlette==1.3.1",
    "urllib3==2.7.0",
    "idna>=3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    # Starlette 1.x uses HTTPX2 for TestClient; plain httpx support is deprecated.
    "httpx2>=2.7.0",
    "ruff>=0.8.0",
    "build>=1.2.0",
    # Exercise official EVM/SVM client compatibility in the payment gate tests.
    "x402[mechanisms]>=2.8.0",
]
x402 = [
    # Optional framework helpers; core schema validation is always installed.
    "x402[fastapi]==2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.shared-data]
"server.json" = "share/blocksize-mcp/server.json"
"docs/developer_portal.html" = "share/blocksize-mcp/docs/developer_portal.html"
"docs/remote_mcp_quickstart.html" = "share/blocksize-mcp/docs/remote_mcp_quickstart.html"
"docs/first_price_quickstart.html" = "share/blocksize-mcp/docs/first_price_quickstart.html"
"docs/agent_framework_integrations.html" = "share/blocksize-mcp/docs/agent_framework_integrations.html"
"docs/prompt_examples.html" = "share/blocksize-mcp/docs/prompt_examples.html"
"docs/privacy_policy.html" = "share/blocksize-mcp/docs/privacy_policy.html"
"docs/support.html" = "share/blocksize-mcp/docs/support.html"
"docs/claude_connector.html" = "share/blocksize-mcp/docs/claude_connector.html"
"docs/assets" = "share/blocksize-mcp/docs/assets"
"docs/pdf" = "share/blocksize-mcp/docs/pdf"
"docs/evidence" = "share/blocksize-mcp/docs/evidence"
"reports/hyperliquid_tradeable_feeds.json" = "share/blocksize-mcp/reports/hyperliquid_tradeable_feeds.json"
"reports/rwa_blocksize_state_discovery.json" = "share/blocksize-mcp/reports/rwa_blocksize_state_discovery.json"
"reports/rwa_daily_feed_agent.json" = "share/blocksize-mcp/reports/rwa_daily_feed_agent.json"
"reports/rwa_derivative_venue_discovery.json" = "share/blocksize-mcp/reports/rwa_derivative_venue_discovery.json"
"reports/rwa_evm_pool_allowlist.json" = "share/blocksize-mcp/reports/rwa_evm_pool_allowlist.json"
"reports/rwa_hyperliquid_paxg_probe.json" = "share/blocksize-mcp/reports/rwa_hyperliquid_paxg_probe.json"
"reports/rwa_jupiter_route_allowlist.json" = "share/blocksize-mcp/reports/rwa_jupiter_route_allowlist.json"
"reports/rwa_rights_clearance.json" = "share/blocksize-mcp/reports/rwa_rights_clearance.json"
"reports/rwa_solana_pool_allowlist.json" = "share/blocksize-mcp/reports/rwa_solana_pool_allowlist.json"
"reports/rwa_solana_token_mints.json" = "share/blocksize-mcp/reports/rwa_solana_token_mints.json"
"reports/rwa_xyz_new_asset_monitor.json" = "share/blocksize-mcp/reports/rwa_xyz_new_asset_monitor.json"

[tool.hatch.build.targets.wheel.force-include]
"scripts/__init__.py" = "scripts/__init__.py"
"scripts/build_rwa_pilot_promotion_packet.py" = "scripts/build_rwa_pilot_promotion_packet.py"
"scripts/run_rwa_growth_pilot.py" = "scripts/run_rwa_growth_pilot.py"
"scripts/run_rwa_pilot_alignment_snapshot.py" = "scripts/run_rwa_pilot_alignment_snapshot.py"
"scripts/run_rwa_pilot_depth_snapshot.py" = "scripts/run_rwa_pilot_depth_snapshot.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
